<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Hand Tracking with Pollinations Voice AI</title>  

<!-- Google MediaPipe Libraries for Hand Tracking -->  
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>  
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>  
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

<style>  
* {  
    margin: 0;  
    padding: 0;  
    box-sizing: border-box;  
}  
  
body {  
    width: 100vw;  
    height: 100vh;  
    background: #000;  
    overflow: hidden;  
    position: relative;  
}  
  
#webcam, #output_canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#webcam { z-index: 1; }
#output_canvas { z-index: 3; pointer-events: none; }
  
#tracker {  
    position: absolute;  
    top: 0;  
    left: 0;  
    pointer-events: none;  
    transform-origin: center;  
    z-index: 5;  
    will-change: transform;   
}  
  
/* Glow Circle CSS */  
.circle {  
    width: 220px;  
    height: 220px;  
    border-radius: 50%;  
    border: 8px solid #00eaff;  
    position: relative;  
    margin-left: -110px;  
    margin-top: -110px;   
    animation: spin 8s linear infinite, glow 2s ease-in-out infinite alternate;  
}  
  
.circle::before {  
    content: "";  
    position: absolute;  
    inset: -12px;  
    border-radius: 50%;  
    border: 8px solid #00ffff;  
    filter: blur(18px);  
    opacity: .8;  
}  
  
.circle::after {  
    content: "";  
    position: absolute;  
    inset: 20px;  
    border-radius: 50%;  
    box-shadow:  
        0 0 25px #00ffff,  
        0 0 60px #00ffff,  
        inset 0 0 25px #00ffff;  
}  
  
@keyframes spin {  
    from { transform: rotate(0deg); }  
    to { transform: rotate(360deg); }  
}  
  
@keyframes glow {  
    from { box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #00ffff; }  
    to { box-shadow: 0 0 40px #00ffff, 0 0 80px #00ffff, 0 0 140px #00ffff; }  
}  
  
.loading-text {  
    color: #00ffff;  
    font-family: sans-serif;  
    position: absolute;  
    top: 50%;  
    left: 50%;  
    transform: translate(-50%, -50%);  
    font-size: 20px;  
    z-index: 10;  
    background: rgba(0, 0, 0, 0.7);  
    padding: 10px 20px;  
    border-radius: 10px;  
}

/* Voice AI Status Bar */
#voice-status {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0, 255, 255, 0.2);
    border: 2px solid #00ffff;
    padding: 12px 25px;
    border-radius: 30px;
    font-family: sans-serif;
    font-size: 16px;
    z-index: 10;
    cursor: pointer;
    box-shadow: 0 0 10px #00ffff;
    transition: all 0.3s ease;
}
#voice-status:hover { background: rgba(0, 255, 255, 0.4); }
</style>  
</head>  
<body>  
    <div class="loading-text" id="loading">ক্যামেরা চালু হচ্ছে... একটু অপেক্ষা করো...</div>  
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="tracker" style="display: none;">  
        <div class="circle"></div>  
    </div>  

    <!-- Voice AI Indicator -->
    <div id="voice-status">🎙️ AI चालू করতে এখানে ক্লিক করো</div>
    
<script>  
// ==========================================
// 1. HAND TRACKING CODE
// ==========================================
const videoElement = document.getElementById('webcam');  
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const tracker = document.getElementById('tracker');  
const loadingText = document.getElementById('loading');  

function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
  
let targetX = window.innerWidth / 2, targetY = window.innerHeight / 2, targetScale = 1;  
let currentX = targetX, currentY = targetY, currentScale = targetScale;  
const lerpSpeed = 0.5;   
  
const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});  
hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });  
  
hands.onResults((results) => {  
    if(loadingText.style.display !== 'none') {  
        loadingText.style.display = 'none';  
        tracker.style.display = 'block';  
    }  

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {  
        const landmarks = results.multiHandLandmarks[0];  
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 3 });
        drawLandmarks(canvasCtx, landmarks, { color: '#ff00ff', lineWidth: 1, radius: 3 });
          
        const thumb = landmarks[4], index = landmarks[8];  
        const midX = (thumb.x + index.x) / 2, midY = (thumb.y + index.y) / 2;  
        const dist = Math.sqrt(Math.pow(index.x - thumb.x, 2) + Math.pow(index.y - thumb.y, 2));  
  
        targetX = (1 - midX) * window.innerWidth;  
        targetY = midY * window.innerHeight;  
        targetScale = Math.max(0.3, dist * 3.5);  
    }  
    canvasCtx.restore();
});  
  
function animate() {  
    currentX += (targetX - currentX) * lerpSpeed;  
    currentY += (targetY - currentY) * lerpSpeed;  
    currentScale += (targetScale - currentScale) * lerpSpeed;  
    tracker.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;  
    requestAnimationFrame(animate);  
}  
animate();   
  
const camera = new Camera(videoElement, {  
    onFrame: async () => { await hands.send({image: videoElement}); },  
    width: 640, height: 480, facingMode: 'user'  
});  
camera.start().catch(err => { loadingText.innerText = "ক্যামেরা অ্যাক্সেস পাওয়া যায়নি!"; console.error(err); });  


// ==========================================
// 2. POLLINATIONS AI (FREE) & VOICE CODE
// ==========================================
const voiceStatus = document.getElementById('voice-status');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;
let isVoiceAIActive = false;
let isSpeaking = false;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true; 
    recognition.interimResults = false;
    recognition.lang = 'bn-IN'; // বাংলা বোঝার জন্য

    recognition.onstart = function() {
        voiceStatus.innerText = "Listening... (কথা বলো)";
        voiceStatus.style.borderColor = "#00ff00";
        voiceStatus.style.color = "#00ff00";
    };

    recognition.onresult = async function(event) {
        const transcript = event.results[event.results.length - 1][0].transcript;
        console.log("User said: ", transcript);
        voiceStatus.innerText = "Thinking...";
        voiceStatus.style.borderColor = "#ffcc00";
        voiceStatus.style.color = "#ffcc00";

        // AI কথা বলার সময় শোনা বন্ধ রাখা
        recognition.stop();
        
        // Pollinations AI API কল
        const aiResponse = await fetchPollinationsResponse(transcript);
        
        // AI-এর উত্তর শোনানো
        speak(aiResponse);
    };

    recognition.onend = function() {
        if (isVoiceAIActive && !isSpeaking) {
            recognition.start();
        }
    };

    recognition.onerror = function(event) {
        console.error("Speech Recognition Error: ", event.error);
        if (event.error === 'not-allowed') isVoiceAIActive = false;
    };
} else {
    voiceStatus.innerText = "তোমার ব্রাউজার Voice AI সাপোর্ট করে না";
}

// Pollinations AI-এর ফ্রি টেক্সট API
async function fetchPollinationsResponse(text) {
    try {
        const response = await fetch('https://text.pollinations.ai/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: [
                    { role: 'system', content: 'You are a helpful AI assistant. Answer the user in short sentences and always reply in Bengali language.' },
                    { role: 'user', content: text }
                ],
                seed: Math.floor(Math.random() * 1000000) // প্রতিবার নতুন উত্তর পাওয়ার জন্য
            })
        });
        
        // Pollinations সরাসরি টেক্সট রেসপন্স পাঠায়
        const aiText = await response.text(); 
        return aiText;
    } catch (error) {
        console.error("API Error:", error);
        return "আমি এখন ইন্টারনেটের সাথে যুক্ত নই।";
    }
}

// AI-এর উত্তর স্পিকার দিয়ে শোনানো
function speak(text) {
    if (!window.speechSynthesis) return;

    isSpeaking = true;
    voiceStatus.innerText = "Speaking...";
    voiceStatus.style.borderColor = "#ff00ff";
    voiceStatus.style.color = "#ff00ff";

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'bn-IN'; 
    utterance.rate = 1; 

    utterance.onend = function() {
        isSpeaking = false;
        if (isVoiceAIActive) {
            recognition.start();
        }
    };

    window.speechSynthesis.speak(utterance);
}

// বাটনে ক্লিক করলে Voice AI অ্যাক্টিভ হবে
voiceStatus.addEventListener('click', () => {
    if (!isVoiceAIActive && recognition) {
        isVoiceAIActive = true;
        recognition.start();
    }
});
</script>  
</body>  
</html>
